services:
  backend:
    build:
      context: ./backend
      args:
        OCR_LANGS: ${OCR_LANGS:-eng tur deu fra spa ita por nld}
    restart: unless-stopped
    # tini as PID 1 reaps OCR worker processes orphaned when a job is cancelled.
    init: true
    environment:
      MAX_FILE_MB: ${MAX_FILE_MB:-100}
      MAX_FILES_PER_JOB: ${MAX_FILES_PER_JOB:-20}
      MAX_PAGES_PER_JOB: ${MAX_PAGES_PER_JOB:-1000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      OCR_JOBS: ${OCR_JOBS:-}
      OCR_OPTIMIZE: ${OCR_OPTIMIZE:-1}
      JOB_TTL_MINUTES: ${JOB_TTL_MINUTES:-120}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-eng}
    volumes:
      - ocr-data:/data
    networks:
      - internal
    # LibreOffice/Ghostscript need some shared memory headroom.
    shm_size: 256m

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      NGINX_MAX_BODY: ${NGINX_MAX_BODY:-1g}
    volumes:
      - ocr-data:/data:ro
    networks:
      - internal
      - public
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ocr-data:

networks:
  # The backend has no route to the internet: untrusted documents can't make it fetch anything.
  internal:
    internal: true
  public:
