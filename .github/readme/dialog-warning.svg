<svg xmlns="http://www.w3.org/2000/svg" width="470" height="150" viewBox="0 0 470 150" font-family="Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif"><title>Warning: put OCR Desk behind your own auth</title><rect x="0" y="0" width="470" height="150" fill="#c0c0c0"/><path d="M0.5 149V0.5H469" fill="none" stroke="#fff"/><path d="M0 149.5H469.5V0" fill="none" stroke="#0a0a0a"/><path d="M1 148.5H468.5V1" fill="none" stroke="#808080"/><defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient></defs><rect x="3" y="3" width="464" height="18" fill="url(#t)"/><text x="8" y="16" font-size="12" font-weight="bold" fill="#fff">OCR Desk</text><rect x="449" y="5" width="16" height="14" fill="#c0c0c0"/><path d="M449.5 18V5.5H464" fill="none" stroke="#fff"/><path d="M449 18.5H464.5V5" fill="none" stroke="#0a0a0a"/><path d="M450 17.5H463.5V6" fill="none" stroke="#808080"/><path d="M453 8h2l2 2 2-2h2v1l-2.5 2.5L461 14v1h-2l-2-2-2 2h-2v-1l2.5-2.5L453 9z"/><g transform="translate(18 36)"><path d="M16 3l14 25H2z" fill="#ffff00" stroke="#000" stroke-linejoin="round"/><path d="M14.5 11h3l-.7 9h-1.6z"/><rect x="14.5" y="22" width="3" height="3"/></g><g font-size="12" fill="#000"><text x="64" y="47">There are no user accounts: a job ID is the only key to its files.</text><text x="64" y="66">If OCR Desk can be reached from outside a trusted network,</text><text x="64" y="85">put it behind your own login (nginx auth_basic, an SSO proxy, ...).</text></g><rect x="195" y="106" width="80" height="26" fill="#c0c0c0"/><path d="M195.5 131V106.5H274" fill="none" stroke="#fff"/><path d="M195 131.5H274.5V106" fill="none" stroke="#0a0a0a"/><path d="M196 130.5H273.5V107" fill="none" stroke="#808080"/><rect x="199" y="110" width="72" height="18" fill="none" stroke="#000" stroke-dasharray="1 1"/><text x="235" y="123" text-anchor="middle" font-size="12">OK</text></svg>
